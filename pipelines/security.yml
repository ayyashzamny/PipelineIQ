name: Security Pipeline
description: Security scanning and vulnerability checks

stages:
  - name: Dependency Check
    commands:
      - echo [SECURITY] Checking for vulnerable dependencies...
      - echo [SECURITY] Scanning npm, pip, and maven packages...
      - timeout /t 1
      - echo [SECURITY] ✓ No critical vulnerabilities found

  - name: SAST Scan
    commands:
      - echo [SECURITY] Running Static Application Security Testing...
      - echo [SECURITY] Analyzing Python and JavaScript code...
      - timeout /t 2
      - echo [SECURITY] ✓ SAST scan completed - 0 issues

  - name: Container Scan
    commands:
      - echo [SECURITY] Scanning Docker images for vulnerabilities...
      - echo [SECURITY] Checking image layers and packages...
      - timeout /t 1
      - echo [SECURITY] ✓ Container scan passed

  - name: License Check
    commands:
      - echo [SECURITY] Verifying software licenses...
      - echo [SECURITY] All licenses compliant with policy
      - timeout /t 1
      - echo [SECURITY] ✓ License check passed

timeout: 60
retry_on_failure: true
max_retries: 1
critical: true
