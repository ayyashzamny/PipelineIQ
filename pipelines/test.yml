name: Test Pipeline
description: Continuous testing and code quality checks

stages:
  - name: Setup
    commands:
      - echo [TEST] Setting up test environment...
      - echo [TEST] Installing dependencies...
      - timeout /t 1
      - echo [TEST] ✓ Setup complete

  - name: Unit Tests
    commands:
      - echo [TEST] Running unit tests...
      - "echo [TEST] Coverage: 95%% - PASSED"
      - timeout /t 2
      - echo [TEST] ✓ All unit tests passed

  - name: Integration Tests
    commands:
      - echo [TEST] Running integration tests...
      - "echo [TEST] Database tests: 50/50 passed"
      - timeout /t 2
      - echo [TEST] ✓ All integration tests passed

  - name: Code Quality
    commands:
      - echo [TEST] Running SonarQube analysis...
      - echo [TEST] Code quality: A grade
      - timeout /t 1
      - echo [TEST] ✓ Code quality check passed

timeout: 60
retry_on_failure: true
max_retries: 1
critical: false
